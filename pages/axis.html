        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .navigation-buttons.hidden {
            display: none;
        }

        #resultContainer .navigation-buttons {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>就活支援アプリ</h1>
        <nav>
            <ul>
                <li><a href="../index.html">ホーム</a></li>
                <li><a href="tracker.html">📊 進捗トラッカー</a></li>

                <li><a href="axis.html" class="active">🎯 軸決定</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="axis-section">
            <h2>自己診断をし、就活の軸を見つけよう</h2>
            <p>以下の質問に答えることで、あなたに合った就活の軸を見つけることができます。</p>

            <div id="questionnaireContainer">
                <div class="phase-container">
                    <h3>フェーズ1：自己理解の深化（What & Why）</h3>
                    <div class="step-container">
                        <h4>ステップ1：価値観の探求</h4>
                        <div class="question-card">
                            <h5>質問1</h5>
                            <p>あなたが「最高の仕事だ！」と感じる瞬間は、次のうちどの要素が満たされた時ですか？</p>
                            <p>最も心が高鳴るものを1つ、次に重要なものを2つ選んでください。</p>
                            <div class="options">
                                <label class="option">
                                    <input type="checkbox" name="q1" value="A">
                                    A. 困難な課題を、自分の知恵と工夫で解決できた時（課題解決の実感）
                                </label>
                                <label class="option">
                                    <input type="checkbox" name="q1" value="B">
                                    B. 自分の仕事が「ありがとう」と誰かに感謝された時（他者貢献の実感）
                                </label>
                                <label class="option">
                                    <input type="checkbox" name="q1" value="C">
                                    C. チーム一丸となって、大きな目標を達成できた時（協調・達成感）
                                </label>
                                <label class="option">
                                    <input type="checkbox" name="q1" value="D">
                                    D. 新しい知識やスキルが身につき、昨日の自分より成長できた時（自己成長の実感）
                                </label>
                                <label class="option">
                                    <input type="checkbox" name="q1" value="E">
                                    E. 自分の成果が、会社の売上や利益に直結した時（事業貢献の実感）
                                </label>
                                <label class="option">
                                    <input type="checkbox" name="q1" value="F">
                                    F. 自分のアイデアが形になり、世の中に影響を与えた時（創造・影響力）
                                </label>
                            </div>
                        </div>

                        <!-- 以下、同様の形式で質問2-10まで続く -->
                        <!-- 省略：実際のコードでは全ての質問を同様の形式で実装 -->

                    </div>
                </div>

                <div class="result-container" id="resultContainer" style="display: none;">
                    <h3>あなたの就活タイプ</h3>
                    <div id="resultType"></div>
                    <div id="resultDetails"></div>
                </div>

                <div class="button-container">
                    <button id="prevButton" class="btn" disabled>前の質問</button>
                    <button id="nextButton" class="btn">次の質問</button>
                    <button id="submitButton" class="btn" style="display: none;">結果を見る</button>
                </div>
            </div>
        </section>
    </main>

        <p>&copy; 2024 就活支援アプリ</p>
